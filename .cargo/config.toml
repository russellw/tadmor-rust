# Build only from the committed vendor/ tree (tools/vendor.py), never from
# crates.io.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true

# SQLx checks each query! against the metadata committed in .sqlx/, never a
# live database (tools/sqlx-prepare.sh regenerates it).
[env]
SQLX_OFFLINE = "true"
