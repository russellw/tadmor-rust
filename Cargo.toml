[package]
name = "tadmor"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

# Every crate here, and its whole locked tree, is vendored by tools/vendor.py.
# New crates or features need a conversation first (docs/stack.md).
[dependencies]
askama = "0.16.1"
axum = "0.8.9"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls", "tokio1", "tokio1-native-tls"] }
pbkdf2 = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
# Already in the tree through axum; ServiceExt::oneshot drives the router in tests.
tower = { version = "0.5.3", default-features = false, features = ["util"] }

# Optimise debug builds: unoptimised, one 600,000-iteration PBKDF2 takes
# about 9 s, and every login pays it. Dependencies get full optimisation;
# our own crate, where the generic PBKDF2 and HMAC code is instantiated,
# gets enough to inline it.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
